<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="920" height="470" fill="#f7f9f8"/>
  <text x="460" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#172226">Diagrama del catálogo — Semana 13</text>

  <rect x="60" y="90" width="330" height="300" rx="14" fill="#ffffff" stroke="#2b7765" stroke-width="2"/>
  <rect x="60" y="90" width="330" height="44" rx="14" fill="#2b7765"/>
  <text x="225" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">CATEGORY</text>
  <text x="82" y="166" font-size="15" fill="#172226">id : BigAutoField (PK)</text>
  <text x="82" y="196" font-size="15" fill="#172226">name : varchar(100) (UK)</text>
  <text x="82" y="226" font-size="15" fill="#172226">description : text</text>
  <text x="82" y="256" font-size="15" fill="#172226">created_at : datetime</text>
  <text x="82" y="305" font-size="14" fill="#77817f">Admin: listado + filtros</text>
  <text x="82" y="330" font-size="14" fill="#77817f">/api/categories/</text>

  <rect x="530" y="90" width="330" height="300" rx="14" fill="#ffffff" stroke="#355c9e" stroke-width="2"/>
  <rect x="530" y="90" width="330" height="44" rx="14" fill="#355c9e"/>
  <text x="695" y="118" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">PRODUCT</text>
  <text x="552" y="166" font-size="15" fill="#172226">id : BigAutoField (PK)</text>
  <text x="552" y="196" font-size="15" fill="#172226">category_id : FK → Category</text>
  <text x="552" y="226" font-size="15" fill="#172226">name : varchar(150)</text>
  <text x="552" y="256" font-size="15" fill="#172226">description : text</text>
  <text x="552" y="286" font-size="15" fill="#172226">price : decimal(10, 2)</text>
  <text x="552" y="316" font-size="15" fill="#172226">stock : positive integer</text>
  <text x="552" y="346" font-size="15" fill="#172226">image : ImageField</text>
  <text x="552" y="376" font-size="15" fill="#172226">created_at : datetime</text>

  <line x1="390" y1="240" x2="530" y2="240" stroke="#172226" stroke-width="2"/>
  <circle cx="390" cy="240" r="5" fill="#172226"/>
  <text x="460" y="227" text-anchor="middle" font-size="13" fill="#172226">1</text>
  <text x="460" y="265" text-anchor="middle" font-size="13" fill="#172226">0..*</text>
  <text x="460" y="290" text-anchor="middle" font-size="12" fill="#77817f">related_name:</text>
  <text x="460" y="307" text-anchor="middle" font-size="12" fill="#77817f">products</text>

  <rect x="250" y="415" width="420" height="36" rx="10" fill="#e8f2ee"/>
  <text x="460" y="439" text-anchor="middle" font-size="14" fill="#1d6b50">La API anida la categoría completa dentro de cada producto</text>
</svg>
